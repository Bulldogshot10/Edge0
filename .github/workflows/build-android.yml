name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Edge0 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/*.gradle*
            android/gradle/**/*.*
            android/gradle.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure Git for llama.cpp patch replay
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build llama.cpp native libraries
        working-directory: android
        env:
          EDGE0_DEPOT: ${{ github.workspace }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          NDK_DIR: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          chmod +x tools/llama/build_vendor_libs.sh
          ./tools/llama/build_vendor_libs.sh

      - name: Build debug APK
        working-directory: android
        env:
          E0_GIT_SHA: ${{ github.sha }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Edge0-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
