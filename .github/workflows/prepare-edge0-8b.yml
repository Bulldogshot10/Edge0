name: Prepare Edge0 8B Model

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-model:
    name: Convert Edge0 8B to Android GGUF
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy huggingface_hub

      - name: Check disk space
        run: df -h

      - name: Download official Edge0 8B checkpoint
        run: |
          mkdir -p models
          hf download Edge0/Edge0-8B-A1B-preview \
            --local-dir models/edge0-8b
          du -sh models/edge0-8b

      - name: Ensure upstream repack helper is present
        run: |
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/Edge0-AI/Edge0/main/windows/tools/repack_mlx_to_gguf.py \
            -o windows/tools/repack_mlx_to_gguf.py
          python -m py_compile windows/tools/repack_mlx_to_gguf.py windows/tools/repack_r3_8b.py
          ls -lh windows/tools/repack_mlx_to_gguf.py windows/tools/repack_r3_8b.py

      - name: Convert MLX checkpoint to Android GGUF
        run: |
          set +e
          python windows/tools/convert_mlx_to_gguf.py \
            --dir models/edge0-8b \
            --out models/edge0-8b-gguf
          rc=$?
          echo "converter exit code: $rc"
          if [ -f models/edge0-8b-gguf/convert.log ]; then
            echo "===== convert.log ====="
            cat models/edge0-8b-gguf/convert.log
            echo "===== end convert.log ====="
          fi
          exit $rc

      - name: Verify generated artifacts
        run: |
          test -s models/edge0-8b-gguf/edge0-8b.gguf
          test -s models/edge0-8b-gguf/lora_edge0_8b-gguf.gguf
          test -s models/edge0-8b-gguf/manifest.json
          ls -lh models/edge0-8b-gguf/
          sha256sum \
            models/edge0-8b-gguf/edge0-8b.gguf \
            models/edge0-8b-gguf/lora_edge0_8b-gguf.gguf \
            models/edge0-8b-gguf/manifest.json

      - name: Upload Edge0 8B Android model
        uses: actions/upload-artifact@v4
        with:
          name: Edge0-8B-Android-GGUF
          path: |
            models/edge0-8b-gguf/edge0-8b.gguf
            models/edge0-8b-gguf/lora_edge0_8b-gguf.gguf
            models/edge0-8b-gguf/manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload conversion debug log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Edge0-8B-conversion-debug
          path: models/edge0-8b-gguf/convert.log
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9
